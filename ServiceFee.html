<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Service Fee</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: #121212;
        color: #fff;
        margin: 0;
        padding: 0;
    }
    .container {
        max-width: 400px;
        margin: 80px auto;
        background: #1f1f1f;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(255,153,0,0.3);
    }
    h1 {
        text-align: center;
        color: #ff9a00;
        margin-bottom: 20px;
        font-size: 20px;
        font-weight: 600;
    }
    label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        color: #ffbb66;
        font-size: 13px;
    }
    input[type="number"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #2a2a2a;
        color: #fff;
        font-size: 14px;
    }
    input[type="number"]::placeholder {
        color: #aaa;
        font-size: 13px;
    }
    button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: #ff9a00;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
        transition: 0.3s;
    }
    button:hover {
        background: #ff7700;
    }
    .message {
        margin-top: 12px;
        padding: 10px;
        border-radius: 6px;
        display: none;
        font-size: 13px;
    }
    .success { background: #28a745; color: #fff; }
    .error { background: #dc3545; color: #fff; }
</style>
</head>
<body>

<div class="container">
    <h1>Set Service Fee</h1>
    <label for="fee">Service Fee (PKR)</label>
    <input type="number" id="fee" placeholder="Enter service fee" />

    <button onclick="setServiceFee()">Apply Service Fee</button>

    <div class="message" id="message"></div>
</div>

<script>
async function setServiceFee() {
    const fee = document.getElementById('fee').value;
    const messageEl = document.getElementById('message');

    if(!fee || isNaN(fee)) {
        messageEl.style.display = 'block';
        messageEl.className = 'message error';
        messageEl.textContent = 'Please enter a valid fee';
        return;
    }

    try {
        const res = await fetch('https://5238f098-6b7a-4815-b792-a10ea88e4c13-00-54fclrw8sb5.pike.replit.dev/admin/service-fee', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fee: Number(fee) })
        });

        const data = await res.json();

        if(data.success) {
            messageEl.style.display = 'block';
            messageEl.className = 'message success';
            messageEl.textContent = `Service fee of ${fee} PKR applied to all orders!`;
        } else {
            messageEl.style.display = 'block';
            messageEl.className = 'message error';
            messageEl.textContent = data.message || 'Failed to apply service fee';
        }
    } catch(err) {
        messageEl.style.display = 'block';
        messageEl.className = 'message error';
        messageEl.textContent = 'Error: ' + err.message;
    }
}
</script>

</body>
</html>
