<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delight.pk - Admin Ads</title>
<style>
  body { font-family:'Segoe UI',sans-serif; max-width:480px; margin:auto; padding:20px; background:#fdfdfd; color:#333; }
  h2 { text-align:center; margin-bottom:20px; color:#ef6c00; }
  input, button { width:100%; padding:12px; margin-top:12px; border-radius:8px; border:1px solid #ccc; font-size:15px; box-sizing:border-box; }
  button { background:#ef6c00; color:#fff; font-weight:bold; cursor:pointer; border:none; transition:0.3s; }
  button:hover { background:#d65c00; }
  .ad-card { border:1px solid #ef6c00; border-radius:10px; padding:12px; margin-bottom:12px; display:flex; align-items:center; gap:10px; background:#fff8e1; }
  .ad-card img { width:80px; height:80px; border-radius:8px; object-fit:cover; }
  .ad-info { flex:1; }
  .ad-info h4 { margin:0; font-weight:bold; color:#d65c00; }
  .ad-info a { color:#333; font-size:14px; word-break:break-word; text-decoration:none; }
  .delete-btn { background:red; color:#fff; padding:6px 10px; border-radius:6px; font-size:13px; cursor:pointer; border:none; }
</style>
</head>
<body>

<h2>📰 Admin - Manage Ads</h2>

<form id="adForm">
  <input type="text" name="title" placeholder="Ad Title" required>
  <input type="text" name="link" placeholder="Ad Link (Optional)">
  <input type="file" name="image" accept="image/*">
  <button type="submit">➕ Add Ad</button>
</form>

<h3 style="margin-top:20px; color:#ef6c00;">Existing Ads</h3>
<div id="adsContainer"></div>

<script>
const apiBase = "https://delight-backend--araindaniyalo2.replit.app"; // Backend URL

// 🔹 Load existing ads
async function loadAds(){
  try {
    const res = await fetch(`${apiBase}/admin/ads`);
    const ads = await res.json();
    const container = document.getElementById("adsContainer");
    container.innerHTML = "";

    if(!ads.length) {
      container.innerHTML = "<p style='text-align:center;color:red;'>No ads yet.</p>";
      return;
    }

    ads.forEach(ad => {
      const div = document.createElement("div");
      div.className = "ad-card";
      div.innerHTML = `
        <img src="${ad.image || 'https://via.placeholder.com/80'}" alt="Ad">
        <div class="ad-info">
          <h4>${ad.title}</h4>
          <a href="${ad.link}" target="_blank">${ad.link || "No link"}</a>
        </div>
        <button class="delete-btn" onclick="deleteAd(${ad.id})">Delete</button>
      `;
      container.appendChild(div);
    });

  } catch(err){
    console.error(err);
    alert("Failed to load ads");
  }
}

// 🔹 Add new ad
document.getElementById("adForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);

  try {
    const res = await fetch(`${apiBase}/admin/add-ad`, {
      method: "POST",
      body: formData
    });
    const data = await res.json();
    if(data.success){
      alert("✅ Ad added");
      form.reset();
      loadAds();
    } else {
      alert("❌ " + data.message);
    }
  } catch(err){
    console.error(err);
    alert("Error adding ad");
  }
});

// 🔹 Delete ad
async function deleteAd(id){
  if(!confirm("Are you sure you want to delete this ad?")) return;
  try {
    const res = await fetch(`${apiBase}/admin/delete-ad/${id}`, { method: "DELETE" });
    const data = await res.json();
    if(data.success){
      alert("✅ Ad deleted");
      loadAds();
    } else {
      alert("❌ " + data.message);
    }
  } catch(err){
    console.error(err);
    alert("Error deleting ad");
  }
}

// Initial load
loadAds();
</script>
</body>
</html>
